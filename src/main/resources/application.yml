server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: multimodalAgent-agent
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/multimodalAgent;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2s}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
          ssl:
            enable: ${MAIL_SMTP_SSL_ENABLE:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:10000}
          timeout: ${MAIL_SMTP_TIMEOUT:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:10000}

logging:
  level:
    root: INFO

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

multimodal-agent:
  ai:
    provider: ${AI_PROVIDER:ollama}
    temperature: ${AI_TEMPERATURE:0.35}
    max-tokens: ${AI_MAX_TOKENS:320}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:multimodalAgent-qwen2.5-7b-ft:latest}
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
  chat:
    history-limit: ${CHAT_HISTORY_LIMIT:6}
    short-memory-ttl-hours: ${CHAT_SHORT_MEMORY_TTL_HOURS:24}
  embedding:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  knowledge:
    top-k: ${RAG_TOP_K:3}
    fast-mode: ${RAG_FAST_MODE:true}
    planner-enabled: ${RAG_PLANNER_ENABLED:false}
    review-enabled: ${RAG_REVIEW_ENABLED:false}
    max-queries: ${RAG_MAX_QUERIES:1}
    use-chroma: ${USE_CHROMA:false}
    chroma-base-url: ${CHROMA_BASE_URL:http://localhost:8000}
    chroma-collection: ${CHROMA_COLLECTION:multimodalAgent_knowledge}
    chunk-size: ${KNOWLEDGE_CHUNK_SIZE:512}
    chunk-overlap: ${KNOWLEDGE_CHUNK_OVERLAP:64}
  multimodal:
    text-weight: ${MULTIMODAL_TEXT_WEIGHT:0.1}
    audio-weight: ${MULTIMODAL_AUDIO_WEIGHT:0.4}
    visual-weight: ${MULTIMODAL_VISUAL_WEIGHT:0.5}
    whisper:
      mode: ${WHISPER_MODE:mock}
      base-url: ${WHISPER_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
      api-key: ${WHISPER_API_KEY:${OPENAI_API_KEY:}}
      model: ${WHISPER_MODEL:whisper-1}
      demo-filename-signals: ${WHISPER_DEMO_FILENAME_SIGNALS:false}
    media-pipe:
      mode: ${MEDIAPIPE_MODE:local-rule}
      url: ${MEDIAPIPE_URL:http://localhost:8090/analyze}
  voice:
    enabled: ${VOICE_ENABLED:false}
    interrupt-enabled: ${VOICE_INTERRUPT_ENABLED:true}
    session-mode: ${VOICE_SESSION_MODE:assistive}
    soothing-voice: ${VOICE_TTS_SOOTHING_VOICE:${VOICE_TTS_VOICE:zh_female_vv_uranus_bigtts}}
    concise-voice: ${VOICE_TTS_CONCISE_VOICE:${VOICE_TTS_VOICE:zh_female_xiaohe_uranus_bigtts}}
    formal-alert-voice: ${VOICE_TTS_FORMAL_ALERT_VOICE:${VOICE_TTS_VOICE:zh_male_m191_uranus_bigtts}}
    livekit:
      url: ${LIVEKIT_URL:}
      api-key: ${LIVEKIT_API_KEY:}
      api-secret: ${LIVEKIT_API_SECRET:}
      token-ttl-minutes: ${LIVEKIT_TOKEN_TTL_MINUTES:30}
    asr:
      provider: ${VOICE_ASR_PROVIDER:doubao}
      model: ${VOICE_ASR_MODEL:doubao-streaming-asr}
      endpoint: ${VOICE_ASR_ENDPOINT:}
      api-key: ${VOICE_ASR_API_KEY:}
      app-id: ${VOICE_ASR_APP_ID:}
      cluster: ${VOICE_ASR_CLUSTER:}
      format: ${VOICE_ASR_FORMAT:pcm}
      sample-rate: ${VOICE_ASR_SAMPLE_RATE:16000}
      language: ${VOICE_ASR_LANGUAGE:zh-CN}
    tts:
      provider: ${VOICE_TTS_PROVIDER:doubao}
      model: ${VOICE_TTS_MODEL:seed-tts-2.0}
      voice: ${VOICE_TTS_VOICE:zh_female_vv_uranus_bigtts}
      endpoint: ${VOICE_TTS_ENDPOINT:}
      api-key: ${VOICE_TTS_API_KEY:${VOICE_TTS_ACCESS_KEY:}}
      app-id: ${VOICE_TTS_APP_ID:}
      app-key: ${VOICE_TTS_APP_KEY:${VOICE_TTS_APP_ID:}}
      group-id: ${VOICE_TTS_GROUP_ID:}
      resource-id: ${VOICE_TTS_RESOURCE_ID:${VOICE_TTS_GROUP_ID:}}
      audio-format: ${VOICE_TTS_AUDIO_FORMAT:mp3}
      sample-rate: ${VOICE_TTS_SAMPLE_RATE:32000}
  mcp:
    server:
      enabled: ${MCP_SERVER_ENABLED:false}
      auth-token: ${MCP_SERVER_TOKEN:}
    excel:
      mode: ${MCP_EXCEL_MODE:local}
      url: ${MCP_EXCEL_URL:${MCP_SERVER_URL:http://localhost:${SERVER_PORT:8080}/mcp}}
      local-path: ${MCP_EXCEL_LOCAL_PATH:./data/multimodalAgent-reports.xlsx}
    email:
      mode: ${MCP_EMAIL_MODE:log}
      url: ${MCP_EMAIL_URL:${MCP_SERVER_URL:http://localhost:${SERVER_PORT:8080}/mcp}}
      from: ${ALERT_MAIL_FROM:multimodalAgent-alerts@example.com}
      recipients: ${ALERT_MAIL_RECIPIENTS:counselor-alerts@example.com}
      max-retries: ${ALERT_MAIL_MAX_RETRIES:2}
  security:
    seed-demo-users: ${SEED_DEMO_USERS:false}
    admin-password: ${MULTIMODAL_AGENT_ADMIN_PASSWORD:}
    student-password: ${MULTIMODAL_AGENT_STUDENT_PASSWORD:}
  http:
    connect-timeout-millis: ${HTTP_CONNECT_TIMEOUT_MILLIS:3000}
    response-timeout-seconds: ${HTTP_RESPONSE_TIMEOUT_SECONDS:30}
  upload:
    knowledge-max-bytes: ${KNOWLEDGE_UPLOAD_MAX_BYTES:2097152}
    multimodal-max-bytes: ${MULTIMODAL_UPLOAD_MAX_BYTES:8388608}
