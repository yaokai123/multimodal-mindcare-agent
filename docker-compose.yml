services:
  app:
    build: .
    image: multimodalagent-agent:0.1.0
    container_name: multimodalAgent-agent
    depends_on:
      - mysql
      - redis
      - chroma
      - ollama
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/multimodalAgent?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: multimodalAgent
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-multimodalAgent-qwen2.5-7b-ft:latest}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-320}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-6}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      RAG_FAST_MODE: ${RAG_FAST_MODE:-true}
      RAG_PLANNER_ENABLED: ${RAG_PLANNER_ENABLED:-false}
      RAG_REVIEW_ENABLED: ${RAG_REVIEW_ENABLED:-false}
      RAG_MAX_QUERIES: ${RAG_MAX_QUERIES:-1}
      USE_CHROMA: ${USE_CHROMA:-true}
      CHROMA_BASE_URL: http://chroma:8000
      MCP_EXCEL_MODE: ${MCP_EXCEL_MODE:-local}
      MCP_EMAIL_MODE: ${MCP_EMAIL_MODE:-log}
      MCP_SERVER_ENABLED: ${MCP_SERVER_ENABLED:-false}
      MCP_SERVER_TOKEN: ${MCP_SERVER_TOKEN:-}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      MULTIMODAL_AGENT_ADMIN_PASSWORD: ${MULTIMODAL_AGENT_ADMIN_PASSWORD:-}
      MULTIMODAL_AGENT_STUDENT_PASSWORD: ${MULTIMODAL_AGENT_STUDENT_PASSWORD:-}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      VOICE_INTERRUPT_ENABLED: ${VOICE_INTERRUPT_ENABLED:-true}
      VOICE_SESSION_MODE: ${VOICE_SESSION_MODE:-assistive}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_TOKEN_TTL_MINUTES: ${LIVEKIT_TOKEN_TTL_MINUTES:-30}
      VOICE_ASR_PROVIDER: ${VOICE_ASR_PROVIDER:-doubao}
      VOICE_ASR_MODEL: ${VOICE_ASR_MODEL:-doubao-streaming-asr}
      VOICE_ASR_ENDPOINT: ${VOICE_ASR_ENDPOINT:-}
      VOICE_ASR_API_KEY: ${VOICE_ASR_API_KEY:-}
      VOICE_ASR_APP_ID: ${VOICE_ASR_APP_ID:-}
      VOICE_ASR_CLUSTER: ${VOICE_ASR_CLUSTER:-}
      VOICE_ASR_FORMAT: ${VOICE_ASR_FORMAT:-pcm}
      VOICE_ASR_SAMPLE_RATE: ${VOICE_ASR_SAMPLE_RATE:-16000}
      VOICE_ASR_LANGUAGE: ${VOICE_ASR_LANGUAGE:-zh-CN}
      VOICE_TTS_PROVIDER: ${VOICE_TTS_PROVIDER:-doubao}
      VOICE_TTS_ENDPOINT: ${VOICE_TTS_ENDPOINT:-}
      VOICE_TTS_API_KEY: ${VOICE_TTS_API_KEY:-}
      VOICE_TTS_APP_ID: ${VOICE_TTS_APP_ID:-}
      VOICE_TTS_APP_KEY: ${VOICE_TTS_APP_KEY:-}
      VOICE_TTS_GROUP_ID: ${VOICE_TTS_GROUP_ID:-}
      VOICE_TTS_RESOURCE_ID: ${VOICE_TTS_RESOURCE_ID:-}
      VOICE_TTS_MODEL: ${VOICE_TTS_MODEL:-seed-tts-2.0}
      VOICE_TTS_VOICE: ${VOICE_TTS_VOICE:-zh_female_vv_uranus_bigtts}
      VOICE_TTS_AUDIO_FORMAT: ${VOICE_TTS_AUDIO_FORMAT:-mp3}
      VOICE_TTS_SAMPLE_RATE: ${VOICE_TTS_SAMPLE_RATE:-32000}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data

  mysql:
    image: mysql:8.4
    container_name: multimodalAgent-mysql
    environment:
      MYSQL_DATABASE: multimodalAgent
      MYSQL_USER: multimodalAgent
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.2-alpine
    container_name: multimodalAgent-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data

  chroma:
    image: chromadb/chroma:latest
    container_name: multimodalAgent-chroma
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - chroma-data:/chroma/chroma

  ollama:
    image: ollama/ollama:latest
    container_name: multimodalAgent-ollama
    gpus: all
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./mindbridge-qwen2.5-7b-ft-q4_k_m.gguf:/models/mindbridge:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mailpit:
    image: axllent/mailpit:latest
    container_name: multimodalAgent-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mysql-data:
  redis-data:
  chroma-data:
  ollama-data:
